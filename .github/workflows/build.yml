name: Optimized Android Release Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-release:
    name: Build optimized release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Generate temporary release keystore
        run: >-
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore"
          -storepass android -alias mo7adaraty -keypass android
          -keyalg RSA -keysize 2048 -validity 10000
          -dname "CN=Mo7adaraty Nova, O=Mo7adaraty, C=MA"

      - name: Build optimized arm64 APK and AAB
        working-directory: android
        run: >-
          ./gradlew :app:assembleRelease :app:bundleRelease
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore"
          -Pandroid.injected.signing.store.password=android
          -Pandroid.injected.signing.key.alias=mo7adaraty
          -Pandroid.injected.signing.key.password=android
          -PreactNativeArchitectures=arm64-v8a

      - name: Upload optimized arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: mo7adaraty-nova-arm64-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: mo7adaraty-nova-arm64-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
